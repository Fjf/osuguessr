services:
  osuguessr:
    build: .
    container_name: osuguessr
    restart: unless-stopped
    ports:
      - "${HOST:-0.0.0.0}:${PORT:-8090}:8080"
    environment:
      # Library source: "stable" (default) or "lazer".
      OSU_SOURCE: ${OSU_SOURCE:-stable}
      # Lazer data folder INSIDE the container. Only used when
      # OSU_SOURCE=lazer; the volume below mounts your real folder here.
      OSU_DIR: ${OSU_DIR:-/data/osu-lazer}
      SONGS_DIR: /data/songs
      BEATMAPS_DIR: /data/osu
      DB_PATH: /data/app/osuguessr.db
    volumes:
      # Your osu! audio files (read-only). Default: standard Windows install.
      - '${OSU_SONGS_DIR:-G:\Program Files\osu!\Songs}:/data/songs:ro'
      # Your osu! root folder, so beatmap files give title/artist/mapper/difficulty.
      - '${OSU_ROOT_DIR:-G:\Program Files\osu!}:/data/osu:ro'
      # Persisted SQLite index (survives restarts; reindex via the UI button).
      - ./data:/data/app
      # osu!lazer: your lazer data folder (the one with client.realm and
      # files/), read-only. Set OSU_SOURCE=lazer in .env and uncomment.
      - '${OSU_LAZER_DIR:-C:\Users\you\AppData\Roaming\osu}:/data/osu-lazer:ro'
